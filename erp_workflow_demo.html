<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ERP Workflow Demo — Job ID / POP / NLD / On Net / Off Net</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --ink:#1f2733; --muted:#6b7686; --line:#e3e8ef;
    --brand:#2563eb; --brand-dk:#1d4ed8; --ok:#15803d; --okbg:#e7f6ec;
    --warn:#b45309; --warnbg:#fff4e2; --bad:#b91c1c; --badbg:#fdeaea;
    --draft:#6b7686; --draftbg:#eef1f5; --live:#0f766e; --livebg:#e2f6f3;
    --chip:#eef2ff; --chipink:#3730a3;
    --radius:10px; --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  a{color:var(--brand)}
  /* layout */
  .app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
  .side{background:#0f172a;color:#cbd5e1;padding:0;position:sticky;top:0;height:100vh;overflow-y:auto}
  .side .logo{padding:18px 18px 10px;font-weight:700;color:#fff;font-size:15px;letter-spacing:.2px}
  .side .logo small{display:block;font-weight:400;color:#7c8aa0;font-size:11px;margin-top:3px}
  .navsec{padding:10px 12px 4px;color:#64748b;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px}
  .navitem{display:flex;align-items:center;gap:8px;padding:9px 16px;cursor:pointer;border-left:3px solid transparent;color:#cbd5e1}
  .navitem:hover{background:#1e293b}
  .navitem.active{background:#1e293b;border-left-color:var(--brand);color:#fff}
  .navitem .ic{width:18px;text-align:center;opacity:.9}
  .navitem .nm{flex:1}
  .navitem .badge{background:#334155;color:#e2e8f0;border-radius:20px;font-size:10.5px;padding:1px 7px;min-width:18px;text-align:center}
  .navitem .badge.has{background:var(--brand);color:#fff}
  .main{padding:0 0 60px}
  .topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
  .topbar h1{font-size:16px;margin:0;flex:1}
  .topbar .sub{color:var(--muted);font-size:12px}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
  .btn:hover{border-color:#c3ccd8}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.pri:hover{background:var(--brand-dk)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:4px 9px;font-size:12px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .wrap{padding:22px 26px;max-width:1080px}
  /* cards / stages */
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;box-shadow:var(--sh);overflow:hidden}
  .stage.locked{opacity:.96}
  .stage>.head{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer;background:#fbfcfe}
  .stage>.head .stg{font-weight:700}
  .stage>.head .desc{color:var(--muted);font-size:12px;font-weight:400}
  .stage>.head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .stage>.body{padding:16px 18px}
  .stage.collapsed>.body{display:none}
  .lockmsg{display:flex;gap:8px;align-items:flex-start;background:var(--draftbg);color:var(--muted);padding:10px 12px;border-radius:8px;font-size:12.5px}
  /* form grid */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px}
  .grid.one{grid-template-columns:1fr}
  .grid.three{grid-template-columns:repeat(3,1fr)}
  .f{display:flex;flex-direction:column;gap:5px}
  .f.full{grid-column:1/-1}
  .f label{font-size:12.5px;font-weight:600;color:#374151;display:flex;align-items:center;gap:6px}
  .f .hint{font-weight:400;color:var(--muted);font-size:11.5px}
  .req{color:var(--bad)}
  input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  textarea{min-height:64px;resize:vertical}
  .radios,.checks{display:flex;flex-wrap:wrap;gap:8px}
  .opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;background:#fff;font-size:12.5px}
  .opt:hover{border-color:#c3ccd8}
  .opt.sel{border-color:var(--brand);background:#eff4ff;color:var(--brand-dk);font-weight:600}
  .opt input{width:auto;margin:0}
  .filebox{border:1px dashed #cbd5e1;border-radius:8px;padding:10px 12px;color:var(--muted);font-size:12px;background:#fbfcfe}
  input.fileinp{border-style:dashed;background:#fbfcfe}
  .info{background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#334155}
  .info.read{border-left-color:#94a3b8}
  /* repeater */
  .rep{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fbfcfe;position:relative}
  .rep .rmv{position:absolute;top:8px;right:8px}
  .rep .ridx{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  /* table */
  table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  table.tbl th,table.tbl td{border:1px solid var(--line);padding:8px 9px;text-align:left;vertical-align:top}
  table.tbl th{background:#f1f5f9;font-size:11.5px;color:#475569}
  table.tbl tr.sel{background:#eff4ff}
  /* tags */
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
  .tag.ok{background:var(--okbg);color:var(--ok)}
  .tag.warn{background:var(--warnbg);color:var(--warn)}
  .tag.bad{background:var(--badbg);color:var(--bad)}
  .tag.draft{background:var(--draftbg);color:var(--draft)}
  .tag.live{background:var(--livebg);color:var(--live)}
  .tag.chip{background:var(--chip);color:var(--chipink)}
  /* gap flag */
  .gap{display:inline-flex;align-items:center;gap:4px;background:var(--warnbg);color:var(--warn);border:1px solid #fcd9a6;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;cursor:help}
  .gapnote{background:var(--warnbg);border:1px solid #fcd9a6;border-radius:8px;padding:9px 12px;font-size:12px;color:#7c4a06;margin-top:6px}
  .gapnote b{color:#92400e}
  /* flow diagram */
  .flow{display:flex;flex-direction:column;gap:0}
  .fnode{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;box-shadow:var(--sh);position:relative}
  .fnode h3{margin:0 0 4px;font-size:14px}
  .fnode p{margin:0;color:var(--muted);font-size:12px}
  .farrow{align-self:center;color:#94a3b8;font-size:20px;margin:6px 0}
  .frow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .toast{position:fixed;bottom:22px;right:22px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px;max-width:340px;z-index:50;opacity:0;transform:translateY(10px);transition:.25s}
  .toast.show{opacity:1;transform:none}
  .pillrow{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--sh);min-width:150px}
  .kpi .n{font-size:22px;font-weight:800}
  .kpi .l{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
  .gaplist .item{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:13px 16px;margin-bottom:12px;box-shadow:var(--sh)}
  .gaplist .item h4{margin:0 0 4px;font-size:13.5px}
  .gaplist .item .where{color:var(--muted);font-size:11.5px;margin-bottom:6px}
  .gaplist .item .ass{font-size:12.5px;background:#f8fafc;border-radius:6px;padding:7px 10px;margin-top:6px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:14px}
  .muted{color:var(--muted)}
  hr.sep{border:none;border-top:1px dashed var(--line);margin:16px 0}
  .subhead{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#475569;margin:4px 0 10px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">Optimal ERP — Provisioning<small>Workflow visualizer · demo build</small></div>
    <div class="navsec">Origin</div>
    <div id="nav"></div>
    <div class="navsec">Views</div>
    <div class="navitem" data-view="flow"><span class="ic">🗺️</span><span class="nm">Flow &amp; Dependencies</span></div>
    <div class="navitem" data-view="gaps"><span class="ic">⚠️</span><span class="nm">Gaps &amp; Assumptions</span><span class="badge has" id="gapBadge">11</span></div>
    <div class="navsec">Demo</div>
    <div class="navitem" data-act="reset"><span class="ic">↺</span><span class="nm">Reset demo state</span></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="ttl">Job ID List</h1>
        <div class="sub" id="tsub">Entry decision tree — drives the whole workflow</div>
      </div>
      <div class="right" style="margin-left:auto;display:flex;gap:8px" id="topActions"></div>
    </div>
    <div class="wrap" id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================================
   ERP WORKFLOW DEMO
   Single-file, no dependencies. Declarative conditional-field engine.
   Faithful to the 6 source PDFs. Gaps are flagged inline with ⚠ + notes.
   ============================================================================ */

/* ---------- shared workflow state ---------- */
const S = {
  cur: 'jobid',                 // current module/view
  showData:false,               // captured-data panel toggle
  collapsed: {},                // stageKey -> bool
  values: {},                   // module.stage -> {field:value}
  flags: {                      // workflow milestones used for gating
    popRaised:false, popCode:null, popStage1Done:false, popStage3Done:false,
    nldGoLive:false
  },
  requests: []                  // {id,module,type,from,status,label}
};
let SEQ = 1;
let GENPOP = 1;   // counter for generated (child) POP ids in NLD Stage 3

/* ---------- helper to read/write field values ---------- */
function vstore(mod, stage){ const k=mod+'.'+stage; return (S.values[k] ||= {}); }
function getv(mod,stage,key){ return vstore(mod,stage)[key]; }
function setv(mod,stage,key,val){ vstore(mod,stage)[key]=val; }

/* ---------- request routing (connected simulation) ---------- */
function raise(module,type,from,label,status){
  const r={id:(module.toUpperCase().slice(0,3))+'-'+String(SEQ++).padStart(4,'0'),
           module,type,from,label,status:status||'New'};
  S.requests.push(r); renderNav();
  toast('→ Request raised in <b>'+MODULES[module].title+'</b><br>'+r.id+' · '+label);
  return r;
}
function reqsFor(mod){ return S.requests.filter(r=>r.module===mod); }
function setReqStatus(mod,type,status){
  S.requests.filter(r=>r.module===mod && (!type||r.type===type)).forEach(r=>r.status=status);
  renderNav();
}

/* ============================================================================
   GAP REGISTRY  (best-guess assumptions are annotated inline by id)
   ============================================================================ */
const GAPS = {
  G1:{t:'Sim Card flow not defined',where:'Job ID List → Off Net → Sim Card',
      a:'Assumed: routes to the Off Net (End Customer) module like Broadband, using the Tunnel DC. No Sim Card-specific form provided.'},
  G2:{t:'Dark Fiber Feasibility module missing',where:'Job ID List → On Net → Wireline → Ring → Dark Fiber Ring',
      a:'Assumed: "Generate Dark Fiber Feasibility" creates a placeholder request; module not specified in any PDF.'},
  G3:{t:'Direct Handoff path under-specified',where:'Off Net (End Customer & P2P) → Direct Handoff',
      a:'Assumed: Direct Handoff skips Stage 4 (distances) and goes Stage 3 → Stage 5 acceptance; no vendor A/B address captured.'},
  G4:{t:'"Reject with Selected POP" outcome undefined',where:'POP Feasibility → Stage 1',
      a:'Assumed: rejecting closes the POP request and assigns the chosen existing POP back to the Job ID. Outcome not stated in PDF.'},
  G5:{t:'No bandwidth threshold rule',where:'POP Feasibility → Stage 1 nearby-POP table',
      a:'Capacity / Allocated / Utilized (Zabbix) are shown but no rule defines when Proceed vs Reject is mandatory.'},
  G6:{t:'Duplicate / inconsistent stage numbers',where:'NLD (two "Stage 6"), On Net (two "Stage 5")',
      a:'Renumbered logically in this demo. Confirm canonical numbering.'},
  G7:{t:'Ambiguous "NLD Go-Live" gate',where:'POP Feasibility → Task module (NLD)',
      a:'Assumed the gate = NLD "Go Live received from Telco" (now Stage 6). Task is blocked until then.'},
  G8:{t:'Job ID "Tunnel DC + Submit" vs full Off Net flow overlap',where:'Job ID Off Net Broadband/Sim Card',
      a:'Assumed the quick submit seeds the Off Net (End Customer) module which then runs vendor collection etc.'},
  G9:{t:'No role / permission model',where:'All modules (BM, FE, Infra, Telco Coord, PR, Invoice)',
      a:'Handoffs are shown as status changes only; no auth/role gating implemented.'},
  G10:{t:'L2POI form only partially specified',where:'NLD / On Net Stage 2 (New L2/L1)',
      a:'Rendered with Node Type / Address / Lat / Long as given; deeper L2POI fields unknown.'},
  G11:{t:'Material Request ↔ PR pipeline order unclear',where:'POP Feasibility Stage 6 → PR',
      a:'Assumed Material Request (Stage 6) hands off into the PR pipeline (PR Stage 1).'}
};
function gapFlag(id){
  const g=GAPS[id];
  return `<span class="gap" title="${(g.t+' — '+g.a).replace(/"/g,'&quot;')}">⚠ ${id}</span>`;
}
function gapNote(id){
  const g=GAPS[id];
  return `<div class="gapnote">${gapFlag(id)} <b>${g.t}.</b> ${g.a}</div>`;
}

/* ============================================================================
   FIELD ENGINE
   A field: {type,key,label,hint,options,required,showIf,note,gap,sub,read,colspan}
   types: text,num,date,select,radio,textarea,file,checks,info,repeater,custom
   showIf(v,state) decides visibility. Re-renders stage on every change.
   ============================================================================ */
function field(mod,stage,f){
  const v=vstore(mod,stage);
  const id=mod+'_'+stage+'_'+f.key;
  const lab=`<label for="${id}">${f.required?'<span class="req">*</span> ':''}${f.label}${f.gap?' '+gapFlag(f.gap):''}${f.hint?` <span class="hint">${f.hint}</span>`:''}</label>`;
  let ctrl='';
  const val=v[f.key];
  switch(f.type){
    case 'info':
      return `<div class="f ${f.colspan?'full':''}"><div class="info ${f.read?'read':''}">${f.label}</div></div>`;
    case 'text': case 'num': case 'date':
      ctrl=`<input id="${id}" type="${f.type==='num'?'number':f.type==='date'?'date':'text'}" value="${val??''}" placeholder="${f.ph||''}"
              oninput="onField('${mod}','${stage}','${f.key}',this.value)">`;
      break;
    case 'textarea':
      ctrl=`<textarea id="${id}" placeholder="${f.ph||''}" oninput="onField('${mod}','${stage}','${f.key}',this.value)">${val??''}</textarea>`;
      break;
    case 'select':
      ctrl=`<select id="${id}" onchange="onField('${mod}','${stage}','${f.key}',this.value)">
              <option value="">— select —</option>
              ${f.options.map(o=>`<option ${val===o?'selected':''}>${o}</option>`).join('')}
            </select>`;
      break;
    case 'radio':
      ctrl=`<div class="radios">${f.options.map(o=>`
              <label class="opt ${val===o?'sel':''}"><input type="radio" name="${id}" ${val===o?'checked':''}
                onchange="onField('${mod}','${stage}','${f.key}','${o}')">${o}</label>`).join('')}</div>`;
      break;
    case 'checks':
      const arr=Array.isArray(val)?val:[];
      ctrl=`<div class="checks">${f.options.map(o=>`
              <label class="opt ${arr.includes(o)?'sel':''}"><input type="checkbox" ${arr.includes(o)?'checked':''}
                onchange="onCheck('${mod}','${stage}','${f.key}','${o}',this.checked)">${o}</label>`).join('')}</div>`;
      break;
    case 'file':
      ctrl=`<input id="${id}" type="text" class="fileinp" value="${val??''}" placeholder="📎 type file name(s)${f.multi?' — comma separated':''}"
              oninput="onField('${mod}','${stage}','${f.key}',this.value)">`;
      return `<div class="f ${f.colspan?'full':''}"><label>${f.label}${f.multi?' <span class="hint">(multiple)</span>':''}</label>${ctrl}</div>`;
    case 'repeater':
      return repeater(mod,stage,f);
  }
  const note=f.note?`<div class="hint" style="margin-top:2px">${f.note}</div>`:'';
  return `<div class="f ${f.colspan?'full':''}">${lab}${ctrl}${note}</div>`;
}

/* repeater: (+) add multiple sub-records */
function repeater(mod,stage,f){
  const v=vstore(mod,stage); const list=(v[f.key] ||= [{}]);
  const inner=list.map((row,i)=>{
    const sub=f.sub.map(sf=>{
      const sid=mod+'_'+stage+'_'+f.key+'_'+i+'_'+sf.key;
      let c='';
      if(sf.type==='select'){
        c=`<select id="${sid}" onchange="onRep('${mod}','${stage}','${f.key}',${i},'${sf.key}',this.value)">
             <option value="">— select —</option>${sf.options.map(o=>`<option ${row[sf.key]===o?'selected':''}>${o}</option>`).join('')}</select>`;
      } else if(sf.type==='textarea'){
        c=`<textarea id="${sid}" oninput="onRep('${mod}','${stage}','${f.key}',${i},'${sf.key}',this.value)">${row[sf.key]??''}</textarea>`;
      } else if(sf.type==='file'){
        c=`<input id="${sid}" type="text" class="fileinp" value="${row[sf.key]??''}" placeholder="📎 type file name(s)"
             oninput="onRep('${mod}','${stage}','${f.key}',${i},'${sf.key}',this.value)">`;
      } else {
        c=`<input id="${sid}" type="${sf.type==='num'?'number':sf.type==='date'?'date':'text'}" value="${row[sf.key]??''}"
             oninput="onRep('${mod}','${stage}','${f.key}',${i},'${sf.key}',this.value)">`;
      }
      const show = sf.showIf? sf.showIf(row,S):true;
      if(!show) return '';
      return `<div class="f ${sf.colspan?'full':''}"><label>${sf.label}${sf.gap?' '+gapFlag(sf.gap):''}</label>${c}</div>`;
    }).join('');
    return `<div class="rep">
        <div class="ridx">${f.itemLabel||'Item'} ${i+1}</div>
        ${list.length>1?`<button class="btn sm ghost rmv" onclick="repDel('${mod}','${stage}','${f.key}',${i})">✕ remove</button>`:''}
        <div class="grid">${sub}</div>
      </div>`;
  }).join('');
  return `<div class="f full">
      <label>${f.label}${f.gap?' '+gapFlag(f.gap):''}</label>
      ${inner}
      <div><button class="btn sm" onclick="repAdd('${mod}','${stage}','${f.key}')">＋ add ${f.itemLabel||'item'}</button></div>
    </div>`;
}

/* field event handlers */
function onField(mod,stage,key,val){ setv(mod,stage,key,val); rerender(); }
function onCheck(mod,stage,key,opt,on){
  const v=vstore(mod,stage); const a=Array.isArray(v[key])?v[key]:[];
  v[key]= on? [...a,opt] : a.filter(x=>x!==opt); rerender();
}
function onRep(mod,stage,key,i,sk,val){ vstore(mod,stage)[key][i][sk]=val; rerender(); }
function repAdd(mod,stage,key){ vstore(mod,stage)[key].push({}); rerender(); }
function repDel(mod,stage,key,i){ const l=vstore(mod,stage)[key]; l.splice(i,1); if(!l.length)l.push({}); rerender(); }

/* ============================================================================
   MODULE DEFINITIONS
   Each module: {title, sub, icon, stages:[{id,title,desc,gate,fields,actions}]}
   gate(state) -> {ok:bool, why:string}  (controls whether stage is enabled)
   fields can be functions of (v,state) returning an array (for full conditional control)
   actions: [{label,cls,onClick,enabled}]
   ============================================================================ */
const MODULES = {

/* ---------------- 1. JOB ID LIST ---------------- */
jobid:{ title:'Job ID List', sub:'Entry decision tree — drives the whole workflow', icon:'📋',
  stages:[{
    id:'s1', title:'Job ID', desc:'Last-mile selection & POP decision',
    fields:(v)=>{
      let F=[
        {type:'text',key:'jobid',label:'Job ID',ph:'JOB-2026-0001'},
        {type:'text',key:'cust',label:'Customer name'},
        {type:'radio',key:'lmtype',label:'Last Mile Type',options:['On Net','Off Net'],required:true},
      ];
      /* ===== ON NET ===== */
      if(v.lmtype==='On Net'){
        F.push({type:'radio',key:'media',label:'Media Type',options:['Wireless','Wireline']});
        if(v.media==='Wireless'){
          F.push({type:'radio',key:'wlPop',label:'POP Availability',options:['Yes','No']});
          if(v.wlPop==='No'){
            F.push({type:'textarea',key:'wlReason',label:'Reason for Creation',colspan:true,note:'On submit → raises POP Feasibility.'});
          } else if(v.wlPop==='Yes'){
            F.push({type:'select',key:'wlSelPop',label:'Select POP',options:popList()});
          }
        }
        if(v.media==='Wireline'){
          F.push({type:'radio',key:'wlnType',label:'Last Mile',options:['Linear+RF','Linear','Ring']});
          if(v.wlnType==='Linear+RF'){
            F.push({type:'radio',key:'lrPop',label:'POP Availability',options:['Yes','No']});
            if(v.lrPop==='No') F.push({type:'textarea',key:'lrReason',label:'Reason for Creation',colspan:true,note:'On submit → raises POP Feasibility.'});
            if(v.lrPop==='Yes') F.push({type:'select',key:'lrSelPop',label:'Select POP',options:popList()});
          }
          if(v.wlnType==='Linear'){
            F.push({type:'radio',key:'linPop',label:'POP Availability',options:['Yes','No']});
            if(v.linPop==='No') F.push({type:'textarea',key:'linReason',label:'Reason for Creation',colspan:true,note:'On submit → raises POP Feasibility.'});

// Step 10: Job POP is always the final endpoint; build the parent-child chain
function nldTopology(v){
  const job='Job POP (final endpoint)';
  let left = nldIsNew(v.aType)
    ? ['Parent POP(A)'+(v.aParentPop?': '+nldShort(v.aParentPop):''), 'New A POP']
    : ['A End'+(v.aType?' (Existing)':'')];
  let right = nldIsNew(v.bType)
    ? ['New B POP', 'Parent POP(B)'+(v.bParentPop?': '+nldShort(v.bParentPop):'')]
    : [];
  return [...left, job, ...right].join(' → ');
}
// Step 12: reference map for the generated child requests
function nldRefMap(v){
  const ends=['a','b'].filter(end=>{
    const ho=v[end+'Handoff'];
    return nldIsNew(v[end+'Type']) && (ho==='On Net'||ho==='Off Net') && v[end+'Transport'];

  if(!ends.length) return null;
  const jobId=getv('pop','s1','jobid')||getv('jobid','s1','jobid')||'(Job)';
  const popReq=(S.requests.find(r=>r.module==='pop'&&r.type==='feasibility')||{}).id||'(POP req)';
  let html='📑 <b>Reference map (generated child requests):</b>';
  ends.forEach(end=>{
    html+='<br>• <b>'+end.toUpperCase()+' End</b> — Job '+jobId+' · POP Req '+popReq+' · Parent NLD (current) · Parent POP '+(nldShort(v[end+'ParentPop'])||'?')+' · Generated POP '+(vstore('nld','s2b')[end+'GenPop']||'?')+' · '+v[end+'Transport']+' · '+v[end+'Handoff'];
  });
  return html;
}

function submitJobId(){
  const v=vstore('jobid','s1');
  const raisesPop =
     (v.lmtype==='On Net' && ((v.media==='Wireless'&&v.wlPop==='No')||(v.media==='Wireline'&&((v.wlnType==='Linear+RF'&&v.lrPop==='No')||(v.wlnType==='Linear'&&v.linPop==='No')||(v.wlnType==='Ring'&&v.ringType==='Last Mile Ring from POP'&&v.rmPop==='No')))))
  || (v.lmtype==='Off Net' && v.offType==='Dark Fiber' && v.dfPop==='No');
  if(v.lmtype==='On Net' && v.media==='Wireline' && v.wlnType==='Ring' && v.ringType==='Dark Fiber Ring'){
    toast('Dark Fiber Feasibility requested (placeholder — see gap G2).'); return;
  }
  if(raisesPop){
    S.flags.popRaised=true;
    raise('pop','feasibility','Job ID List','Job '+(v.jobid||'(new)')+' · '+(v.cust||'')+' · '+(v.lmtype||''),'New');
    // seed POP stage 1 with job details
    const p=vstore('pop','s1'); p.jobid=v.jobid; p.cust=v.cust;
    go('pop');
  } else if(v.lmtype==='Off Net' && (v.offType==='Broadband'||v.offType==='Sim Card'||v.offType==='Dark Fiber')){
    raise('offcust','customer','Job ID List','Off Net '+v.offType+' · '+(v.cust||''),'New');
    if(v.offType==='Dark Fiber') vstore('offcust','s0').media='Dark Fiber';
    if(v.offType==='Broadband'||v.offType==='Sim Card') vstore('offcust','s0').media='Broadband';
    go('offcust');
  } else {
    toast('Job submitted — existing POP selected, no feasibility needed.');
  }
}

function submitPopS1(){
  const v=vstore('pop','s1');
  if(v.decision==='Reject with Selected POP'){
    setReqStatus('pop',null,'Closed — assigned '+(v.rejPop||'existing POP'));
    toast('POP request rejected · '+(v.rejPop||'existing POP')+' assigned back to Job ID. (assumption G4)');
    return;
  }
  S.flags.popStage1Done=true;
  setReqStatus('pop',null,'In Feasibility');
  // spawn backhaul request
  if(v.backhaul==='NLD'){
    raise('nld','backhaul','POP Feasibility','NLD draft for '+(v.jobid||'job'),'Draft');
  } else if(v.backhaul==='On Net'){
    raise('onnet','backhaul','POP Feasibility','On Net (waiting for POP code)','Waiting — POP Stage 3');
  } else if(v.backhaul==='Off Net'){
    raise('offp2p','backhaul','POP Feasibility','Off Net P2P (waiting for POP code)','Waiting — POP Stage 3');
  }
  toast('Stage 1 submitted. Backhaul = '+v.backhaul);
  rerender();
}

// Build the per-end config fields (Step 5-8): Handoff → Parent POP (always) → Transport (On/Off Net)
function nldEndBlock(F,v,end){
  if(!nldIsNew(v[end+'Type'])) return;            // Existing → no extra config
  const E=end.toUpperCase();
  F.push({type:'radio',key:end+'Handoff',label:E+' End Handoff Type',options:['Direct','On Net','Off Net'],colspan:true});
  const ho=v[end+'Handoff'];
  if(ho==='Direct'){
    F.push({type:'select',key:end+'ParentPop',label:E+' End Parent POP',options:popList()});
  } else if(ho==='On Net' || ho==='Off Net'){
    F.push({type:'select',key:end+'ParentPop',label:E+' End Parent POP',options:popList()});
    F.push({type:'radio',key:end+'Transport',label:E+' End Transport Type',options:['Wireless','Wireline','Ring'],colspan:true});
  }
}
// Step 11/Rule 7-8: On/Off Net New end → POP Feasibility request + On/Off-Net request (reconciled)
function nldEndReconcile(end){
  const v=vstore('nld','s2b');
  const ho=v[end+'Handoff'], transport=v[end+'Transport'], parent=v[end+'ParentPop'];
  const need=nldIsNew(v[end+'Type']) && (ho==='On Net'||ho==='Off Net') && !!transport;
  const popTag='nld-'+end+'-pop', netTag='nld-'+end+'-net';
  const exists=S.requests.some(r=>r.type===popTag);
  if(need && !exists){
    const gen=v[end+'GenPop'] || (v[end+'GenPop']='POP-NEW-'+end.toUpperCase()+String(GENPOP++).padStart(2,'0'));
    S.flags.popRaised=true;
    raise('pop',popTag,'NLD '+end.toUpperCase()+' End','POP Feasibility (child) '+gen+' · parent '+(nldShort(parent)||'?')+' · '+ho+'/'+transport,'New · NLD ref');
    raise(ho==='On Net'?'onnet':'offp2p',netTag,'NLD '+end.toUpperCase()+' End',ho+' request '+gen+' · '+transport,'New · NLD ref');
  } else if(!need && exists){
    S.requests=S.requests.filter(r=>r.type!==popTag && r.type!==netTag);
    delete v[end+'GenPop']; renderNav();
  }
}
function genNldId(){
  raise('nld','id','PR','System-generated NLD/Backhaul ID','New Activation Pending');
  toast('NLD/Backhaul ID generated → New Activation Pending.');
  rerender();
}

/* ============================================================================
   RENDERING
   ============================================================================ */
function renderNav(){
  const order=[['jobid'],['pop'],['nld','onnet'],['offcust','offp2p']];
  const nav=document.getElementById('nav');
  const items=Object.keys(MODULES).map(m=>{
    const n=reqsFor(m).length;
    const active=S.cur===m?'active':'';
    return `<div class="navitem ${active}" data-mod="${m}">
       <span class="ic">${MODULES[m].icon}</span><span class="nm">${MODULES[m].title}</span>
       <span class="badge ${n?'has':''}">${n||''}</span></div>`;
  }).join('');
  nav.innerHTML=items;
  nav.querySelectorAll('[data-mod]').forEach(el=>el.onclick=()=>go(el.dataset.mod));
  // view items active state
  document.querySelectorAll('[data-view]').forEach(el=>{
    el.classList.toggle('active',S.cur===el.dataset.view);
    el.onclick=()=>go(el.dataset.view);
  });
  document.querySelector('[data-act="reset"]').onclick=resetDemo;
  document.getElementById('gapBadge').textContent=Object.keys(GAPS).length;
}

function go(target){ S.cur=target; renderNav(); render(); window.scrollTo(0,0); }

function render(){
  // capture focus + caret so typing survives the re-render
  const a=document.activeElement;
  const aid=a&&a.id?a.id:null;
  let ss=null,se=null; try{ ss=a.selectionStart; se=a.selectionEnd; }catch(e){}
  const view=document.getElementById('view');
  const ttl=document.getElementById('ttl'), tsub=document.getElementById('tsub');
  const ta=document.getElementById('topActions'); ta.innerHTML='';
  if(S.cur==='flow'){ ttl.textContent='Flow & Dependencies'; tsub.textContent='How a request propagates across the 6 modules'; view.innerHTML=renderFlow(); return; }
  if(S.cur==='gaps'){ ttl.textContent='Gaps & Assumptions'; tsub.textContent='11 gaps found in the PDFs — best-guess assumptions applied'; view.innerHTML=renderGaps(); return; }
  const M=MODULES[S.cur];
  ttl.textContent=M.title; tsub.textContent=M.sub;
  // top actions: data viewer + expand/collapse
  ta.innerHTML=`<button class="btn sm ghost" onclick="toggleData()">${S.showData?'▴ Hide':'▾ Show'} captured data</button>
                <button class="btn sm ghost" onclick="setAllStages(false)">Expand all</button>
                <button class="btn sm ghost" onclick="setAllStages(true)">Collapse all</button>`;
  // request status pills
  const reqs=reqsFor(S.cur);
  let pills='';
  if(reqs.length){ pills='<div class="pillrow">'+reqs.map(r=>`<span class="tag chip">${r.id}</span> <span class="tag ${statusCls(r.status)}">${r.status}</span> <span class="muted" style="margin-right:10px">${r.label}</span>`).join('')+'</div>'; }
  const dataPanel=S.showData?`<div class="info" style="white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;margin-bottom:16px">${escapeHtml(JSON.stringify(moduleData(S.cur),null,2))}</div>`:'';
  view.innerHTML = pills + dataPanel + M.stages.map(st=>renderStage(S.cur,st)).join('');
  bindStageHeads();
  // restore focus + caret
  if(aid){ const el=document.getElementById(aid); if(el){ try{el.focus({preventScroll:true});}catch(e){el.focus();} try{if(ss!=null)el.setSelectionRange(ss,se);}catch(e){} } }
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function moduleData(mod){
  const out={}; Object.keys(S.values).filter(k=>k.startsWith(mod+'.')).forEach(k=>{ out[k.split('.')[1]]=S.values[k]; });
  return Object.keys(out).length?out:{'(no data entered yet)':''};
}
function toggleData(){ S.showData=!S.showData; render(); }
function setAllStages(collapsed){
  const M=MODULES[S.cur]; M.stages.forEach(st=>{ S.collapsed[S.cur+'.'+st.id]=collapsed; }); render();
}
function statusCls(s){ if(/Active|Approved|active|ready/.test(s))return 'live'; if(/Await|Waiting|Draft|Revalidate|Pending|Hold/.test(s))return 'warn'; if(/Closed|Reject/.test(s))return 'bad'; return 'draft'; }

function renderStage(mod,st){
  const key=mod+'.'+st.id;
  const gate=st.gate?st.gate(S):{ok:true};
  const collapsed=S.collapsed[key]?'collapsed':'';
  const v=vstore(mod,st.id);
  let bodyInner;
  if(!gate.ok){
    bodyInner=`<div class="lockmsg">🔒 <div><b>Locked.</b> ${gate.why}</div></div>`;
  } else {
    const fields=(typeof st.fields==='function')?st.fields(v,S):(st.fields||[]);
    const inner=fields.map(f=>{
      if(f.showIf && !f.showIf(v,S)) return '';
      if(f.type==='custom') return f.render();
      return field(mod,st.id,f);
    }).join('');
    const acts=(st.actions?(typeof st.actions==='function'?st.actions(v,S):st.actions):[]);
    const actHtml=acts.length?`<div style="margin-top:16px;display:flex;gap:10px">${acts.map(a=>`<button class="btn ${a.cls||''}" ${a.enabled?'':'disabled'} onclick="${a.onClick}">${a.label}</button>`).join('')}</div>`:'';
    bodyInner=`<div class="grid">${inner}</div>${actHtml}`;
  }
  return `<div class="stage ${collapsed} ${gate.ok?'':'locked'}" data-key="${key}">
     <div class="head">
       <span class="stg">${st.title}</span>
       <span class="desc">${st.desc||''}</span>
       <span class="right">${gate.ok?'':'<span class="tag draft">🔒 locked</span>'}</span>
     </div>
     <div class="body">${bodyInner}</div>
   </div>`;
}
function bindStageHeads(){
  document.querySelectorAll('.stage .head').forEach(h=>{
    h.onclick=()=>{ const k=h.parentElement.dataset.key; S.collapsed[k]=!S.collapsed[k]; render(); };
  });
}

/* re-render current module/view (used by field changes) */
function rerender(){ render(); }

function renderFlow(){
  const f=S.flags;
  const chk=(b)=>b?'<span class="tag ok">done</span>':'<span class="tag draft">pending</span>';
  return `
  <div class="legend">
    <span><span class="tag ok">done</span> milestone reached</span>
    <span><span class="tag draft">pending</span> not yet</span>
    <span><span class="tag warn">waiting</span> blocked by dependency</span>
  </div>
  <div class="flow">
    <div class="fnode"><h3>1 · Job ID List ${chk(f.popRaised)}</h3><p>Decision tree. If POP unavailable → raises POP Feasibility. If Off Net Broadband/Sim/Dark-Fiber → seeds Off Net (End Customer).</p></div>
    <div class="farrow">↓ raises</div>
    <div class="fnode"><h3>2 · POP Feasibility — Stage 1 ${chk(f.popStage1Done)}</h3><p>Backhaul type chosen here. <b>NLD</b> draft appears <u>immediately</u>; <b>On Net / Off Net P2P</b> wait for the POP code (Stage 3).</p></div>
    <div class="frow" style="margin:6px 0">
      <div class="fnode"><h3>3a · NLD Feasibility</h3><p>Starts after Stage 1. Feeds Installation details back to POP Stage 4. Go-Live gates POP task.</p></div>
      <div class="fnode"><h3>3b · On Net Backhaul</h3><p>${f.popStage3Done?'<span class="tag live">unlocked</span>':'<span class="tag warn">waiting for POP code</span>'}</p></div>
      <div class="fnode"><h3>3c · Off Net P2P</h3><p>${f.popStage3Done?'<span class="tag live">unlocked</span>':'<span class="tag warn">waiting for POP code</span>'}</p></div>
    </div>
    <div class="farrow">↓ Stage 2 survey → Juggle → Stage 3</div>
    <div class="fnode"><h3>POP Stage 3 · POP Code ${chk(f.popStage3Done)}</h3><p>${f.popCode?('Generated <b>'+f.popCode+'</b> — unlocks On Net & Off Net P2P.'):'Generating the POP code (POP-YYYY-seq5) unlocks On Net & Off Net P2P backhaul.'}</p></div>
    <div class="farrow">↓ parallel feedback loops</div>
    <div class="fnode"><h3>POP Stage 4 ↔ NLD/On Net Installation</h3><p>Installation (Juggle-1) details surface here for <b>Approve / Revalidate</b>. Revalidate → back to FE.</p></div>
    <div class="farrow">↓</div>
    <div class="fnode"><h3>PR pipeline → Provisioning → 3-day Observation → Acceptance → Active</h3><p>Rack/Power (NetBox) → Device (conditional on backhaul) → Cables → Last Mile (On Net) / Task → Provisioning → Observation → POP/Circuit Active.</p></div>
  </div>`;
}

function renderGaps(){
  const kpis=`<div class="pillrow">
    <div class="kpi"><div class="n">11</div><div class="l">gaps flagged</div></div>
    <div class="kpi"><div class="n">6</div><div class="l">modules designed</div></div>
    <div class="kpi"><div class="n">7</div><div class="l">cross-module deps</div></div>
  </div>`;
  const list=Object.entries(GAPS).map(([id,g])=>`
    <div class="item"><h4>${gapFlag(id)} &nbsp; ${g.t}</h4>
      <div class="where">📍 ${g.where}</div>
      <div class="ass"><b>Assumption applied in demo:</b> ${g.a}</div>
    </div>`).join('');
  return kpis+'<div class="gaplist">'+list+'</div>';
}

/* ---------- reset ---------- */
function resetDemo(){
  S.values={}; S.collapsed={}; S.requests=[]; SEQ=1; GENPOP=1; S.showData=false;
  S.flags={popRaised:false,popCode:null,popStage1Done:false,popStage3Done:false,nldGoLive:false};
  go('jobid'); toast('Demo state reset.');
}

/* ---------- toast ---------- */
let toastT;
function toast(html){
  const t=document.getElementById('toast'); t.innerHTML=html; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3200);
}

/* ---------- boot ---------- */
renderNav(); render();
</script>
